<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>任务详情</title>
    <link rel="stylesheet" href="/hierarchy.css" />
  </head>
  <body data-page="task-detail">
    <main class="shell">
      <nav id="breadcrumb" class="breadcrumb"></nav>

      <header class="page-head">
        <div>
          <p class="eyebrow">任务详情</p>
          <h1 id="task-title">任务详情</h1>
          <p id="task-subtitle" class="subtitle"></p>
        </div>
        <div class="top-actions">
          <button id="delete-task-button" type="button" class="secondary-button">删除任务</button>
        </div>
      </header>

      <p id="status" class="status"></p>

      <section class="panel">
        <div class="meta-grid" id="task-meta"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>执行进度</h2>
        </div>
        <div id="task-progress"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>生成结果</h2>
        </div>
        <div id="task-results" class="stack-list"></div>
      </section>
    </main>

    <dialog id="reject-dialog" class="files-dialog">
      <div class="files-dialog-head">
        <h2>结构化驳回</h2>
        <p id="reject-dialog-subtitle" class="subtitle">请填写这条生成结果的驳回原因。</p>
        <p id="reject-dialog-status" class="dialog-status" aria-live="polite"></p>
      </div>
      <form id="reject-form" class="files-list stack-form" method="dialog">
        <label>
          原因分类
          <select name="reasonCategory" required>
            <option value="coverage_gap">覆盖缺失</option>
            <option value="traceability_issue">来源追踪问题</option>
            <option value="wording_issue">表述问题</option>
            <option value="logic_issue">逻辑错误</option>
            <option value="validation_gap">校验缺失</option>
            <option value="other">其他</option>
          </select>
        </label>
        <label>
          原因标签
          <input name="reasonTags" type="text" placeholder="例如：边界条件, 来源不足, 术语不一致" />
        </label>
        <label>
          严重程度
          <select name="severity">
            <option value="low">低</option>
            <option value="medium" selected>中</option>
            <option value="high">高</option>
          </select>
        </label>
        <label>
          驳回说明
          <textarea name="reasonText" rows="5" required placeholder="请说明为什么要驳回这条结果。"></textarea>
        </label>
        <label>
          期望修正
          <textarea name="expectedNote" rows="4" placeholder="可选：描述你期望模型后续如何修正。"></textarea>
        </label>
        <label>
          修正规则类型
          <select name="targetArea" required>
            <option value="validation" selected>Validation / 校验规则</option>
            <option value="writing">Writing / 写作规则</option>
            <option value="extraction">Extraction / 抽取规则</option>
            <option value="examples">Examples / 示例规则</option>
            <option value="domain_knowledge">Domain Knowledge / 领域知识</option>
          </select>
        </label>
        <label>
          修正层级
          <select name="targetLayerConstraint" required>
            <option value="module">Module</option>
            <option value="domain">Domain</option>
            <option value="docType" selected>DocType</option>
            <option value="generic">Generic</option>
          </select>
        </label>
        <label class="checkbox-item">
          <input name="includeInPool" type="checkbox" checked />
          <span>加入驳回池，供后续反馈聚类与回投修正使用</span>
        </label>
        <div class="form-actions">
          <button id="reject-form-submit" type="submit">确认驳回</button>
          <button id="reject-form-cancel" type="button" class="secondary-button">取消</button>
          <button id="reject-dialog-close" type="button" class="secondary-button">关闭</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/hierarchy.js"></script>
  </body>
</html>
