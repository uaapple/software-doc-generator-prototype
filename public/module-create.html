<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>功能模块信息</title>
    <link rel="stylesheet" href="/hierarchy.css" />
    <link rel="stylesheet" href="/feedback-widget.css" />
  </head>
  <body data-page="module-create">
    <main class="shell narrow">
      <nav id="breadcrumb" class="breadcrumb"></nav>

      <header class="page-head">
        <div>
          <p class="eyebrow">Module</p>
          <h1 id="module-form-title">创建功能模块</h1>
          <p id="module-form-subtitle" class="subtitle">例如充电管理、扭矩干预、高压管理。创建后先确认 domain 和 skill 初始化策略。</p>
        </div>
      </header>

      <p id="status" class="status"></p>

      <section class="panel">
        <form id="module-form" class="stack-form">
          <label>
            &#27169;&#22359;&#21517;&#31216;
            <input name="name" required placeholder="&#20363;&#22914;&#65306;&#25197;&#30697;&#24178;&#39044;" />
          </label>
          <label>
            &#27169;&#22359;&#35828;&#26126;
            <textarea name="description" rows="4" placeholder="&#21487;&#36873;&#65292;&#25551;&#36848;&#27169;&#22359;&#32844;&#36131;&#19982;&#36793;&#30028;"></textarea>
          </label>
          <label>
            Module Skill Key
            <input name="moduleSkillKey" placeholder="charging_management" />
          </label>

          <section class="stack-card" id="module-preview-card">
            <strong>Domain &#25512;&#33616;&#19982; Skill &#20505;&#36873;</strong>
            <p id="module-preview-hint" class="inline-hint">&#36755;&#20837;&#27169;&#22359;&#21517;&#31216;&#21518;&#65292;&#31995;&#32479;&#20250;&#25512;&#33616; domain &#24182;&#26816;&#26597;&#26159;&#21542;&#23384;&#22312;&#21487;&#22797;&#29992;&#30340; module skill&#12290;</p>
            <label>
              Domain
              <select name="domain" id="domain-select"></select>
            </label>
            <label>
              &#21487;&#22797;&#29992;&#30340; Module Skill
              <select name="importedSkillKey" id="skill-candidate-select">
                <option value="">&#19981;&#23548;&#20837;&#65292;&#21518;&#32493;&#36208;&#20919;&#21551;&#21160;</option>
              </select>
            </label>
            <div id="bootstrap-requirements" class="inline-hint"></div>
          </section>

          <div class="form-actions">
            <button id="module-submit-button" type="submit">创建并进入模块</button>
            <a id="project-back-link" class="secondary-link" href="#">&#36820;&#22238;&#24037;&#31243;&#39029;</a>
          </div>
        </form>
      </section>
    </main>

    <script type="module" src="/hierarchy.js"></script>
    <script type="module" src="/feedback-widget.js"></script>
  </body>
</html>
