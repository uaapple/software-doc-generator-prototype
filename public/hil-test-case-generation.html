<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HIL 测试用例生成</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/feedback-widget.css" />
  </head>
  <body data-page-kind="generator" data-document-type="hil_test_case">
    <main class="layout">
      <nav class="top-nav">
        <div class="brand-mark">
          <img src="/assets/itk-logo.jpg" alt="ITK Engineering" class="brand-mark-logo" />
          <div>
            <p class="brand-kicker">ITK ENGINEERING</p>
            <strong>HIL 测试用例生成平台</strong>
          </div>
        </div>
        <div class="nav-links">
          <a class="nav-link" href="/">工程列表</a>
          <a class="nav-link" href="/requirement-generation">软件需求生成</a>
          <a class="nav-link" href="/detail-design-generation">详细设计生成</a>
          <a class="nav-link active" href="/hil-test-case-generation">HIL 用例生成</a>
          <a class="nav-link" href="/feedback-pool">反馈池</a>
          <a class="nav-link" href="/skill-management">技能管理</a>
          <a class="nav-link" href="/skill-refinement">Skill Refinement 工作台</a>
        </div>
      </nav>

      <nav id="generator-breadcrumb" class="breadcrumb-strip card"></nav>

      <section class="workbench-strip card">
        <div>
          <p class="strip-label">生成工具</p>
          <h1 id="generator-title">HIL 测试用例生成</h1>
          <p id="generator-subtitle" class="strip-text">在当前功能模块上下文中选择资产并发起 HIL 测试用例生成任务。</p>
        </div>
        <div class="strip-actions">
          <a id="back-to-module" class="hero-link secondary" href="/">返回功能模块</a>
        </div>
      </section>

      <section class="panel panel-grid">
        <div class="card">
          <div class="section-head">
            <span class="section-index">01</span>
            <div>
              <h2>当前上下文</h2>
              <p id="context-copy">正在加载工程和功能模块信息。</p>
            </div>
          </div>
          <div id="context-meta" class="summary"></div>
        </div>

        <div class="card generate-card">
          <div class="section-head">
            <span class="section-index">02</span>
            <div>
              <h2>启动生成</h2>
              <p>选择要参与本次生成的模块资产，也可以额外上传新的输入文件。</p>
            </div>
          </div>
          <label>
            当前模型
            <select id="llm-profile-select" name="llmProfileId"></select>
          </label>
          <p id="llm-profile-hint" class="inline-hint"></p>
          <p id="meta" class="meta-message"></p>
          <p id="status" class="status"></p>
        </div>
      </section>

      <section class="panel panel-grid">
        <section class="card">
          <div class="section-head">
            <span class="section-index">03</span>
            <div>
              <h2>模块资产</h2>
              <p>勾选已有资产作为本次生成输入。</p>
            </div>
          </div>
          <div id="asset-picker" class="files-list"></div>
        </section>

        <form id="generate-form" class="card" enctype="multipart/form-data">
          <div class="section-head">
            <span class="section-index">04</span>
            <div>
              <h2>补充上传</h2>
              <p>这些文件会先进入当前模块资产，再参与本次生成。</p>
            </div>
          </div>
          <label>
            系统需求文件
            <input type="file" name="systemPdf" accept=".pdf,.json,.md,.txt" multiple />
          </label>
          <label>
            模型文档 / PDF
            <input type="file" name="modelPdf" accept=".pdf,.json,.md,.txt" multiple />
          </label>
          <label>
            生成代码文件
            <input type="file" name="generatedCode" accept=".c,.h,.txt" multiple />
          </label>
          <label>
            SLX 模型
            <input type="file" name="slx" accept=".slx" multiple />
          </label>
          <label>
            <span id="reference-example-copy">??????</span>
            <input type="file" name="referenceExample" accept=".pdf,.json,.md,.txt" multiple />
          </label>
          <button id="generate-button" type="submit">启动生成</button>
        </form>
      </section>
    </main>

    <script type="module" src="/generator.js"></script>
    <script type="module" src="/task-queue-widget.js"></script>
    <script type="module" src="/feedback-widget.js"></script>
  </body>
</html>
