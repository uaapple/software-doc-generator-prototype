<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · 生成工具</title>
    <link rel="stylesheet" href="/app.css" />
    <style>
      body{min-height:100vh;display:grid;place-items:center;background:#f3f5f7}.login-card{width:min(420px,calc(100% - 32px));padding:32px}.login-card h1{margin:8px 0}.login-card form{display:grid;gap:16px;margin-top:24px}.login-card label{display:grid;gap:7px;font-weight:700}.login-card input{padding:12px;border:1px solid #c9d0d6;border-radius:8px}.login-card button{padding:12px}.login-status{margin-top:14px;color:#b42318}.login-note{color:#667085;line-height:1.6}
    </style>
  </head>
  <body>
    <main class="card login-card">
      <p class="strip-label">ITK ENGINEERING</p>
      <h1>登录生成工具</h1>
      <p class="login-note">使用管理员或管理员创建的账户登录。</p>
      <form id="login-form">
        <label>用户名<input name="username" autocomplete="username" required /></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" minlength="8" required /></label>
        <button type="submit">登录</button>
      </form>
      <p id="login-status" class="login-status" hidden></p>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
