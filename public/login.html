<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>登录 · 软件文档生成工作台</title>
    <link rel="stylesheet" href="/app.css" />
    <style>
      :root {
        --login-ink: #17243a;
        --login-muted: #718099;
        --login-line: #cbd5e3;
        --login-blue: #075bd8;
        --login-blue-deep: #034ec5;
        --login-danger: #b42318;
      }

      html { min-width: 320px; }

      body.login-page {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--login-ink);
        background: #f6f8fb url("/assets/login-background.png") center / cover no-repeat fixed;
        font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      }

      .login-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 54px 24px 72px;
      }

      .login-panel {
        width: min(472px, 100%);
        margin-top: -22px;
        text-align: center;
      }

      .login-brand {
        width: 142px;
        height: 124px;
        margin: 0 auto 25px;
        object-fit: contain;
        mix-blend-mode: multiply;
      }

      .login-accent {
        width: 28px;
        height: 3px;
        margin: 0 auto 24px;
        border-radius: 999px;
        background: var(--login-blue);
      }

      .login-title {
        margin: 0;
        color: #111d30;
        font-size: clamp(34px, 3.2vw, 42px);
        font-weight: 750;
        line-height: 1.18;
        letter-spacing: -0.045em;
      }

      .login-subtitle {
        margin: 11px 0 32px;
        color: var(--login-muted);
        font-size: 17px;
        font-weight: 500;
        line-height: 1.6;
        letter-spacing: 0.01em;
      }

      .login-form {
        display: grid;
        gap: 20px;
        text-align: left;
      }

      .login-field {
        display: grid;
        gap: 9px;
      }

      .login-label {
        color: #243550;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.4;
      }

      .login-control { position: relative; }

      .login-input {
        width: 100%;
        height: 56px;
        padding: 0 17px 0 51px;
        color: var(--login-ink);
        font-size: 16px;
        border: 1px solid var(--login-line);
        border-radius: 12px;
        outline: none;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 1px 2px rgba(20, 42, 76, 0.02);
        transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      .login-input::placeholder { color: #9aa8bc; }

      .login-input:hover {
        border-color: #aebdd0;
        background: rgba(255, 255, 255, 0.9);
      }

      .login-input:focus-visible {
        border-color: #3179dd;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 0 0 4px rgba(7, 91, 216, 0.13), inset 0 1px 0 #fff;
      }

      .login-input:-webkit-autofill,
      .login-input:-webkit-autofill:hover,
      .login-input:-webkit-autofill:focus {
        -webkit-text-fill-color: var(--login-ink);
        -webkit-box-shadow: 0 0 0 1000px rgba(255, 255, 255, 0.9) inset;
        caret-color: var(--login-ink);
      }

      .password-input { padding-right: 68px; }

      .login-control-icon {
        position: absolute;
        top: 50%;
        left: 17px;
        width: 20px;
        height: 20px;
        transform: translateY(-50%);
        opacity: 0.67;
        filter: invert(39%) sepia(18%) saturate(861%) hue-rotate(176deg) brightness(91%);
        pointer-events: none;
      }

      .password-toggle {
        position: absolute;
        top: 50%;
        left: auto;
        right: 9px;
        width: 48px;
        min-width: 48px;
        min-height: 38px;
        padding: 0 8px;
        transform: translateY(-50%);
        color: #627692;
        font-size: 12px;
        font-weight: 700;
        border: 0;
        border-radius: 8px;
        background: transparent;
        box-shadow: none;
      }

      .password-toggle img {
        width: 19px;
        height: 19px;
        margin: auto;
        opacity: 0.72;
        filter: invert(39%) sepia(18%) saturate(861%) hue-rotate(176deg) brightness(91%);
      }

      .password-toggle:hover {
        transform: translateY(-50%);
        color: var(--login-blue);
        background: rgba(7, 91, 216, 0.08);
      }

      .password-toggle:focus-visible {
        outline: 3px solid rgba(7, 91, 216, 0.18);
        outline-offset: 1px;
      }

      .login-submit {
        position: relative;
        width: 100%;
        min-height: 58px;
        margin-top: 2px;
        overflow: hidden;
        color: #fff;
        font-size: 17px;
        font-weight: 750;
        letter-spacing: 0.04em;
        border: 1px solid rgba(0, 64, 169, 0.24);
        border-radius: 12px;
        background: linear-gradient(180deg, #1269e5 0%, var(--login-blue) 56%, var(--login-blue-deep) 100%);
        box-shadow: 0 10px 24px rgba(7, 91, 216, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.26);
        transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
      }

      .login-submit::after {
        content: "";
        position: absolute;
        inset: 0 0 52% 0;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0));
      }

      .login-submit:hover {
        transform: translateY(-1px);
        filter: saturate(1.04);
        box-shadow: 0 13px 28px rgba(7, 91, 216, 0.23), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }

      .login-submit:active { transform: translateY(0); }

      .login-submit:focus-visible {
        outline: 4px solid rgba(7, 91, 216, 0.18);
        outline-offset: 3px;
      }

      .login-submit:disabled {
        cursor: wait;
        filter: saturate(0.7);
        opacity: 0.76;
        transform: none;
      }

      .login-status {
        margin: 15px 0 0;
        padding: 11px 13px;
        color: var(--login-danger);
        font-size: 14px;
        font-weight: 600;
        line-height: 1.5;
        text-align: left;
        border: 1px solid rgba(180, 35, 24, 0.2);
        border-radius: 10px;
        background: rgba(255, 244, 243, 0.88);
      }

      .access-note {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 28px 0 0;
        color: #71819a;
        font-size: 14px;
        font-weight: 600;
      }

      .access-note img {
        width: 18px;
        height: 18px;
        opacity: 0.7;
        filter: invert(39%) sepia(18%) saturate(861%) hue-rotate(176deg) brightness(91%);
      }

      @media (max-width: 640px) {
        body.login-page { background-position: 42% center; }
        .login-shell { align-items: start; padding: 42px 20px 54px; }
        .login-panel { margin-top: 0; }
        .login-brand { width: 118px; height: 104px; margin-bottom: 20px; }
        .login-accent { margin-bottom: 20px; }
        .login-title { font-size: 34px; }
        .login-subtitle { margin-bottom: 27px; font-size: 15px; }
        .login-form { gap: 17px; }
        .login-input { height: 54px; }
        .login-submit { min-height: 56px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .login-input,
        .password-toggle,
        .login-submit { transition: none; }
      }
    </style>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel" aria-labelledby="login-title">
        <img class="login-brand" src="/assets/itk-logo.jpg" alt="ITK Engineering" />
        <div class="login-accent" aria-hidden="true"></div>
        <h1 class="login-title" id="login-title">欢迎回来</h1>
        <p class="login-subtitle">登录软件文档生成工作台</p>

        <form class="login-form" id="login-form">
          <label class="login-field">
            <span class="login-label">用户名</span>
            <span class="login-control">
              <input class="login-input" name="username" autocomplete="username" placeholder="请输入用户名" required />
              <img class="login-control-icon" src="/assets/icons/person.svg" alt="" aria-hidden="true" />
            </span>
          </label>

          <label class="login-field">
            <span class="login-label">密码</span>
            <span class="login-control">
              <input class="login-input password-input" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" minlength="8" required />
              <img class="login-control-icon" src="/assets/icons/lock.svg" alt="" aria-hidden="true" />
              <button class="password-toggle" id="password-toggle" type="button" aria-controls="login-password" aria-label="显示密码" aria-pressed="false"><img src="/assets/icons/eye.svg" alt="" aria-hidden="true" /></button>
            </span>
          </label>

          <button class="login-submit" type="submit">登录</button>
        </form>

        <p id="login-status" class="login-status" role="alert" hidden></p>
        <p class="access-note"><img src="/assets/icons/shield-check.svg" alt="" aria-hidden="true" />仅限授权用户访问</p>
      </section>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
