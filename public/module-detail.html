<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>&#21151;&#33021;&#27169;&#22359;</title>
    <link rel="stylesheet" href="/hierarchy.css" />
  </head>
  <body data-page="module-detail">
    <main class="shell">
      <nav id="breadcrumb" class="breadcrumb"></nav>

      <header class="page-head module-page-head">
        <div class="module-page-head-body">
          <p class="eyebrow">Module</p>
          <h1 id="module-title">&#21151;&#33021;&#27169;&#22359;</h1>
          <p id="module-description" class="subtitle"></p>
          <div class="module-head-actions">
            <div class="module-primary-actions" role="tablist" aria-label="模块工作区">
              <button id="accepted-results-link" class="secondary-link button-link module-workspace-tab" type="button" data-workspace-tab="accepted_results">已采纳结果</button>
              <button id="req-generate-link" class="primary-link module-workspace-tab" type="button" data-workspace-tab="software_requirement">进入软件需求生成</button>
              <button id="detail-generate-link" class="secondary-link button-link module-workspace-tab" type="button" data-workspace-tab="detail_design">进入详细设计生成</button>
              <button id="hil-generate-link" class="secondary-link button-link module-workspace-tab" type="button" data-workspace-tab="hil_test_case">进入 HIL 用例生成</button>
              <button id="feedback-pool-link" class="secondary-link button-link module-workspace-tab" type="button" data-workspace-tab="feedback_pool">进入模块反馈池</button>
            </div>
            <div class="module-secondary-actions">
              <button id="open-history-drawer" type="button" class="secondary-button">历史任务</button>
              <a id="edit-module-link" class="secondary-link button-link" href="#">编辑模块</a>
              <button id="delete-module-button" type="button" class="secondary-button">删除模块</button>
            </div>
          </div>
        </div>
      </header>

      <p id="status" class="status"></p>

      <section id="module-workspace-panel" class="panel module-workspace-panel" hidden>
        <div class="module-workspace-shell">
          <div class="module-workspace-frame-wrap">
            <iframe id="module-workspace-frame" class="module-workspace-frame" title="模块工作区"></iframe>
          </div>
        </div>
      </section>

      <section class="panel accepted-results-panel">
        <div class="panel-head accepted-results-head">
          <div>
            <h2>&#24050;&#37319;&#32435;&#32467;&#26524;</h2>
            <p class="muted accepted-results-note">按软件需求、详细设计、HIL 用例三个域分区查看。点击卡片可跳转到对应生成结果继续查看原始上下文。</p>
          </div>
        </div>
        <div id="accepted-list" class="stack-list accepted-results-list"></div>
      </section>
    </main>

    <div id="history-drawer-backdrop" class="history-drawer-backdrop" hidden></div>
    <aside id="history-drawer" class="history-drawer" aria-hidden="true">
      <div class="history-drawer-head">
        <div>
          <p class="eyebrow">History</p>
          <h2>历史生成任务</h2>
          <p class="muted">从右侧快速查看任务记录，进入后可继续看完整生成详情。</p>
        </div>
        <button id="close-history-drawer" type="button" class="secondary-button">关闭</button>
      </div>
      <div id="task-list" class="stack-list history-drawer-list"></div>
    </aside>

    <div id="feedback-history-drawer-backdrop" class="history-drawer-backdrop feedback-history-drawer-backdrop" hidden></div>
    <aside id="feedback-history-drawer" class="history-drawer feedback-history-drawer" aria-hidden="true">
      <div class="history-drawer-head feedback-history-drawer-head">
        <div>
          <p class="eyebrow">Fallback History</p>
          <h2>Fallback 历史任务</h2>
          <p class="muted">从整个模块页右侧查看运行中和已完成的 Replay / Fallback 任务。</p>
        </div>
        <button id="close-feedback-history-drawer" type="button" class="secondary-button">关闭</button>
      </div>
      <div class="feedback-history-drawer-shell">
        <div id="feedback-history-task-list" class="stack-list feedback-history-task-list"></div>
        <div id="feedback-history-task-detail" class="feedback-history-task-detail empty-state">选择一条历史任务查看详情。</div>
      </div>
    </aside>

    <dialog id="accepted-edit-dialog" class="files-dialog accepted-edit-dialog">
      <div class="files-dialog-head">
        <h3>编辑已采纳结果</h3>
        <p id="accepted-edit-subtitle" class="muted">更新标题和正文内容。</p>
      </div>
      <form id="accepted-edit-form" class="stack-form accepted-edit-form">
        <label>
          标题
          <input id="accepted-edit-title" name="title" required />
        </label>
        <label>
          正文
          <textarea id="accepted-edit-text" name="requirementText" rows="10" required></textarea>
        </label>
        <div class="form-actions accepted-edit-actions">
          <button type="submit">保存修改</button>
          <button id="accepted-edit-cancel" type="button" class="secondary-button">取消</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/hierarchy.js"></script>
  </body>
</html>
