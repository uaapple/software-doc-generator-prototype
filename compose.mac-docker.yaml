name: software-doc-generator-mac-docker

# Local Mac stack: platform backend container + DSH worker container + shared
# task volume. MATLAB runs natively on the Mac host behind the MATLAB Gateway
# (host process, see docs/mac-docker-local-stack.md); the worker reaches it via
# host.docker.internal:5100. Backend -> worker dispatch reuses the original
# agent transport (HERMES_TRANSPORT=api + HERMES_BASE_URL).

services:
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: containers/backend/Dockerfile
    image: ${SDG_BACKEND_IMAGE:?set SDG_BACKEND_IMAGE}
    pull_policy: never
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      APP_RUNTIME_ROLE: platform
      APP_DATA_DIR: /var/lib/sdg/data
      HOST: 0.0.0.0
      PORT: 3000
      HERMES_TRANSPORT: api
      HERMES_BASE_URL: http://worker:3101
      TCSD_STAGE_EXECUTOR: dsh
      TCSD_DSH_COMMAND: dsh
      TCSD_DSH_PROFILE: headless
      TCSD_DSH_PRESET: unit-test-case-generation-production
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    volumes:
      - type: bind
        source: ${SDG_MAC_DATA_DIR:?set SDG_MAC_DATA_DIR}
        target: /var/lib/sdg/data
    ports:
      - "3000:3000"
    depends_on:
      - worker

  worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: containers/worker/Containerfile
    image: ${SDG_DSH_WORKER_IMAGE:?set SDG_DSH_WORKER_IMAGE}
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      APP_ENV: production
      APP_RUNTIME_ROLE: hermes-agent
      APP_DATA_DIR: /var/lib/sdg/data
      APP_SKILLS_DIR: /opt/sdg/app/skills
      HERMES_HOST: 0.0.0.0
      HERMES_PORT: 3101
      TCSD_WORKSPACE_ROOT: /var/lib/sdg/data
      DSH_HOME: /var/lib/sdg/dsh-home
      TCSD_DSH_PROFILE: headless
      TCSD_DSH_PRESET: unit-test-case-generation-production
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      SATK_GATEWAY_URL: ${SATK_GATEWAY_URL:-http://host.docker.internal:5100}
      SATK_GATEWAY_MAPPING_ID: worker-data
      SATK_MATLAB_SESSION_MODE: gateway
      SATK_MATLAB_DISPLAY_MODE: nodesktop
      TCSD_CLEAN_STALE_MCP: "0"
      TCSD_GATEWAY_TRANSPORT: /usr/local/bin/tcsd-gateway-transport
    volumes:
      - type: bind
        source: ${SDG_MAC_DATA_DIR:?set SDG_MAC_DATA_DIR}
        target: /var/lib/sdg/data
      - type: bind
        source: ${SDG_MAC_LOG_DIR:-${SDG_MAC_DATA_DIR}/logs/worker}
        target: /var/lib/sdg/logs
      - type: volume
        source: dsh-home
        target: /var/lib/sdg/dsh-home
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    secrets:
      - tcsd-gateway
    ports:
      - "3101:3101"

secrets:
  tcsd-gateway:
    file: ./secrets/tcsd-gateway.env
    uid: "0"
    gid: "10002"
    mode: 0440

volumes:
  dsh-home:
    name: ${SDG_DSH_HOME_VOLUME_NAME:-sdg-dsh-home-mac}
