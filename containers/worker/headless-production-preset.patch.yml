# Applied only to the DSH headless profile. It adds the Worker production
# composition and makes it the default agent preset for each one-shot session.
#
# The TCSD headless runner is NOT swapped here: DSH patch semantics reject a
# patch row whose `name` differs from the target row (skipped with a warning),
# so a file:// replacement of the stock `headless-runner` never takes effect.
# Instead the worker image overwrites the stock @deepseek-ai/dsh-headless
# package entry (lib/index.js) with the TCSD runner at the FILE level; the row
# keeps its id `headless-runner` and name `@deepseek-ai/dsh-headless`, so the
# loader's app-entry resolution is untouched. DISABLING the stock row would
# leave the loader with no app to reach ready state and `loader.await()` hangs.
- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        # Note: profile boot REPLACES `roots` with the shipped system root
        # (config/agent-presets); keep includeUserRoot at its default (true)
        # so the plugin also scans $DSH_HOME/.agent-presets, where the
        # entrypoint force-copies this preset on every start.
        default: unit-test-case-generation-production
