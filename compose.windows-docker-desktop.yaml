name: software-doc-generator-windows-worker

x-worker-runtime: &worker-runtime
  platform: linux/amd64
  init: true
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 30s
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m

services:
  permissions-init:
    platform: linux/amd64
    image: ${SDG_WORKER_IMAGE:?SDG_WORKER_IMAGE must be an immutable reference}
    pull_policy: never
    user: "0:0"
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    entrypoint:
      - /bin/sh
      - -eu
      - -c
    command:
      - |
        for directory in /state/data /state/logs /state/hermes-home; do
          chgrp 20000 "$$directory"
          chmod 2770 "$$directory"
        done
    volumes:
      - type: bind
        source: ${SDG_CONTAINER_DATA_DIR:?SDG_CONTAINER_DATA_DIR must be set}
        target: /state/data
      - type: bind
        source: ${SDG_WORKER_LOG_DIR:?SDG_WORKER_LOG_DIR must be set}
        target: /state/logs
      - type: volume
        source: hermes-home
        target: /state/hermes-home

  worker:
    <<: *worker-runtime
    image: ${SDG_WORKER_IMAGE:?SDG_WORKER_IMAGE must be an immutable reference}
    pull_policy: never
    group_add:
      - "20000"
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      APP_ENV: production
      APP_RUNTIME_ROLE: hermes-agent
      APP_DATA_DIR: /var/lib/sdg/data
      APP_SKILLS_DIR: /opt/sdg/app/skills
      HERMES_HOST: 0.0.0.0
      HERMES_PORT: 3101
      HERMES_BASE_URL: http://worker:3101
      HERMES_TRANSPORT: cli
      HERMES_COMMAND: /opt/sdg/venv/bin/hermes
      HERMES_HOME: /var/lib/sdg/hermes-home
      HERMES_STATE_DB_PATH: /var/lib/sdg/hermes-home/state.db
      HERMES_AUTH_TOKEN: ${HERMES_AGENT_TOKEN:?HERMES_AGENT_TOKEN must be set}
      HERMES_PROFILE: ${HERMES_PROFILE:-}
      HERMES_INFERENCE_PROVIDER: ${HERMES_INFERENCE_PROVIDER:?HERMES_INFERENCE_PROVIDER must be set}
      HERMES_INFERENCE_MODEL: ${HERMES_INFERENCE_MODEL:?HERMES_INFERENCE_MODEL must be set}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      GLM_API_KEY: ${GLM_API_KEY:-${ZHIPU_API_KEY:-}}
      GLM_BASE_URL: ${GLM_BASE_URL:-${ZHIPU_BASE_URL:-}}
      HERMES_SERVER_REQUEST_TIMEOUT_MS: "0"
      HERMES_TASK_CONCURRENCY: "1"
      TCSD_PIPELINE_PYTHON: /opt/sdg/venv/bin/python
      TCSD_STAGE_HERMES_SKILLS_DIR: /var/lib/sdg/hermes-home/skills
      TCSD_STAGE_HERMES_PROFILE: ${TCSD_STAGE_HERMES_PROFILE:-}
      TCSD_STAGE_HERMES_MAX_TURNS: ${TCSD_STAGE_HERMES_MAX_TURNS:-200}
      TCSD_STAGE_HERMES_TIMEOUT_MS: ${TCSD_STAGE_HERMES_TIMEOUT_MS:-7200000}
      TCSD_STAGE_HERMES_WATCHDOG_STALL_MS: ${TCSD_STAGE_HERMES_WATCHDOG_STALL_MS:-300000}
      UNIT_TEST_CASE_PROJECT_ADDON_ROOT: /var/lib/sdg/project-addons
      UNIT_TEST_CASE_PROJECT_ADMIN_CODE: ${UNIT_TEST_CASE_PROJECT_ADMIN_CODE:-114301}
      UNIT_TEST_CASE_DEFAULT_PROJECTS: ${UNIT_TEST_CASE_DEFAULT_PROJECTS:-01_楚能,02_TMS}
      UNIT_TEST_CASE_EXPECTED_OUTPUT_PATTERN: outputs/*_tcsd.xlsx
      MATLAB_MCP_TRANSPORT: http
      MATLAB_MCP_BASE_URL: ${MATLAB_MCP_BASE_URL:-http://host.docker.internal:5100}
      MATLAB_MCP_HTTP_MODE: gateway
      MATLAB_MCP_AUTH_TOKEN: ${MATLAB_GATEWAY_TOKEN:?MATLAB_GATEWAY_TOKEN must be set}
      MATLAB_GATEWAY_EVALUATE_TOKEN: ${MATLAB_GATEWAY_EVALUATE_TOKEN:?MATLAB_GATEWAY_EVALUATE_TOKEN must be set}
      MATLAB_MCP_TIMEOUT_MS: ${MATLAB_MCP_TIMEOUT_MS:-300000}
      SATK_GATEWAY_URL: ${SATK_GATEWAY_URL:-http://host.docker.internal:5100}
      SATK_GATEWAY_MAPPING_ID: ${SATK_GATEWAY_MAPPING_ID:-worker-data}
      MATLAB_GATEWAY_CONTAINER_ROOT: ${MATLAB_GATEWAY_CONTAINER_ROOT:-/var/lib/sdg/data}
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: /tmp
    volumes:
      - type: bind
        source: ${SDG_CONTAINER_DATA_DIR:?SDG_CONTAINER_DATA_DIR must be set}
        target: /var/lib/sdg/data
      - type: bind
        source: ${SDG_PROJECT_ADDONS_DIR:?SDG_PROJECT_ADDONS_DIR must be set}
        target: /var/lib/sdg/project-addons
        read_only: true
      - type: volume
        source: hermes-home
        target: /var/lib/sdg/hermes-home
      - type: bind
        source: ${SDG_WORKER_LOG_DIR:?SDG_WORKER_LOG_DIR must be set}
        target: /var/lib/sdg/logs
    ports:
      - ${SDG_WORKER_BIND_IP:?SDG_WORKER_BIND_IP must be an approved host address}:${SDG_WORKER_PORT:-3101}:3101
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3101/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  hermes-home:
    name: ${SDG_HERMES_VOLUME_NAME:-sdg-hermes-home-prod}
